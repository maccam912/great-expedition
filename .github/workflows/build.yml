name: Build, test, and publish releases

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep each main commit's build queued even when a newer commit is pushed.
  group: build-${{ github.ref }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: windows
            os: windows-2022
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/iroh/target
          key: rust-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'native/iroh/Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: .tools
          key: godot-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('tools/versions.json') }}
      - name: Rust checks
        if: matrix.platform == 'linux'
        run: |
          cargo fmt --manifest-path native/iroh/Cargo.toml --check
          cargo clippy --locked --manifest-path native/iroh/Cargo.toml -- -D warnings
      - name: Build native host extension
        run: python tools/build_native.py
      - name: Import and test host plus two clients
        run: python tools/check.py
      - name: Export game
        run: python tools/export.py ${{ matrix.platform }} --skip-build
      - name: Upload games
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.platform }}
          path: build/artifacts/*
          if-no-files-found: error
      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/bin/*
          if-no-files-found: error
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.platform }}
          path: build/smoke/*.log
          if-no-files-found: ignore

  release:
    name: Publish release
    # Every push to main publishes "Build N" (N = workflow run number); v* tags publish as named.
    if: github.event_name == 'push' && !github.event.deleted && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    concurrency:
      # Check and update Latest one release at a time, keeping every build queued.
      group: great-expedition-release
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: game-*
          merge-multiple: true
          path: release
      - name: Publish release assets
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check --strict great-expedition-{linux.zip,macos.zip,windows.zip}.sha256

          tag="$GITHUB_REF_NAME"
          title="$tag"
          latest=true
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tag="build-$GITHUB_RUN_NUMBER"
            title="The Great Expedition build $GITHUB_RUN_NUMBER"

            # A slower build can finish after a newer one has already shipped.
            # shellcheck disable=SC2016
            latest_tag=$(gh api graphql -F owner='{owner}' -F name='{repo}' \
              -f query='query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) { latestRelease { tagName } }
              }' --jq '.data.repository.latestRelease.tagName // ""')
            if [[ "$latest_tag" =~ ^build-([1-9][0-9]*)$ ]] && (( BASH_REMATCH[1] > GITHUB_RUN_NUMBER )); then
              latest=false
            fi

            git push origin "$GITHUB_SHA:refs/tags/$tag"

            # A rerun can finish an interrupted draft or skip a published release.
            if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
              if [[ "$draft" == true ]]; then
                gh release upload "$tag" great-expedition-* --clobber
                gh release edit "$tag" --draft=false --prerelease=false --latest="$latest"
              fi
              exit 0
            fi
          fi

          gh release create "$tag" great-expedition-* --verify-tag --generate-notes --title "$title" --latest="$latest"
